sonar.projectKey=EvgeniiIvanov_go-project-278
sonar.organization=evgeniiivanov

sonar.projectName=go-project-278
sonar.sourceEncoding=UTF-8

# Analyze Go application code only.
sonar.sources=.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/node_modules/**,**/tmp/**,**/bin/**,**/internal/db/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/node_modules/**,**/tmp/**,**/bin/**

# Generated by CI tests step.
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
